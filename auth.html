<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | بخورنا — حسابك في متجر البخور</title>
    <meta name="description" content="سجّل دخولك لحسابك في بخورنا لمتابعة طلباتك من العود والبخور الفاخر.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://bukorna.online/auth.html">
    <meta property="og:title" content="حسابي | بخورنا">
    <meta property="og:site_name" content="بخورنا">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --dark:   #1a1208;
    --dark-2: #211a0c;
    --gold:   #c9a84c;
    --gold-2: #e8c96a;
    --cream:  #f5ead6;
    --cream-2:rgba(245,234,214,0.65);
    --red:    #ff6b6b;
    --green:  #25D366;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--dark);
    color: var(--cream);
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  /* Card */
  .auth-card {
    width: 100%; max-width: 420px;
    background: var(--dark-2);
    border: 1px solid rgba(201,168,76,0.18);
    border-radius: 22px;
    padding: 36px 28px;
    animation: fadeUp 0.4s ease both;
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(16px); }
    to   { opacity:1; transform:translateY(0); }
  }

.logo {
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    height: 48px;                 /* ارتفاع ثابت */
    margin-bottom: 12px;
    overflow: hidden;             /* يمنع أي تجاوز */
}

.logo-img {
    height: 100%;
    max-height: 48px;
    max-width: 100%;              /* لن يتجاوز عرض البطاقة */
    width: auto;
    object-fit: contain;
    display: block;
}

/* يمكن إضافة هامش سفلي إضافي للشعار داخل profile-view */
.logo-sm {
    margin-bottom: 16px;
}
  /* Tabs */
  .tabs {
    display: flex;
    background: rgba(201,168,76,0.06);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 24px;
  }
  .tab-btn {
    flex: 1; padding: 9px;
    border: none; background: transparent;
    color: var(--cream-2);
    font-family: 'Cairo', sans-serif;
    font-size: 0.9rem; font-weight: 600;
    border-radius: 8px; cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: var(--gold);
    color: var(--dark);
  }

  /* Form */
  .form-group { margin-bottom: 16px; }
  .form-label {
    display: block;
    font-size: 0.82rem;
    color: var(--cream-2);
    margin-bottom: 7px;
  }
  .form-input {
    width: 100%;
    background: var(--dark);
    border: 1px solid rgba(201,168,76,0.22);
    border-radius: 10px;
    color: var(--cream);
    padding: 13px 16px;
    font-family: 'Cairo', sans-serif;
    font-size: 0.95rem;
    direction: ltr;
    text-align: right;
    transition: border-color 0.2s;
  }
  .form-input:focus { outline: none; border-color: var(--gold); }
  .form-input.error { border-color: var(--red); }

  /* Submit btn */
  .submit-btn {
    width: 100%;
    background: var(--gold);
    color: var(--dark);
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-family: 'Cairo', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.2s;
  }
  .submit-btn:hover { background: var(--gold-2); transform: translateY(-1px); }
  .submit-btn:disabled { background: #444; color: #888; cursor: not-allowed; transform: none; }

  /* Messages */
  .alert {
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 0.85rem;
    margin-top: 14px;
    display: none;
    text-align: center;
  }
  .alert.show { display: block; }
  .alert-success { background: rgba(37,211,102,0.12); border: 1px solid rgba(37,211,102,0.3); color: var(--green); }
  .alert-error   { background: rgba(255,107,107,0.12); border: 1px solid rgba(255,107,107,0.3); color: var(--red); }

  /* Divider */
  .divider {
    text-align: center;
    color: var(--cream-2);
    font-size: 0.8rem;
    margin: 20px 0 16px;
    position: relative;
  }
  .divider::before, .divider::after {
    content: '';
    position: absolute;
    top: 50%; width: 38%;
    height: 1px;
    background: rgba(201,168,76,0.12);
  }
  .divider::before { right: 0; }
  .divider::after  { left: 0; }

  /* Back link */
  .back-link {
    text-align: center;
    margin-top: 20px;
    font-size: 0.85rem;
    color: var(--cream-2);
  }
  .back-link a { color: var(--gold); text-decoration: none; font-weight: 700; }

  /* Profile section (shown after login) */
  .profile-view { display: none; }
  .profile-view.visible { display: block; }
  .auth-form.hidden { display: none; }

  .profile-email {
    text-align: center;
    background: rgba(201,168,76,0.08);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .profile-email .p-label { font-size: 0.78rem; color: var(--cream-2); margin-bottom: 4px; }
  .profile-email .p-value { font-size: 0.95rem; font-weight: 700; color: var(--gold); direction: ltr; }

  .orders-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 12px; }
  .order-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px;
    background: var(--dark);
    border: 1px solid rgba(201,168,76,0.1);
    border-radius: 10px;
    margin-bottom: 8px;
    text-decoration: none;
    color: var(--cream);
    transition: border-color 0.2s;
  }
  .order-item:hover { border-color: rgba(201,168,76,0.3); }
  .order-item-num { font-weight: 700; font-size: 0.9rem; }
  .order-item-info { font-size: 0.78rem; color: var(--cream-2); margin-top: 2px; }
  .order-item-total { color: var(--gold); font-weight: 700; font-size: 0.9rem; }

  .status-pill {
    display: inline-block;
    padding: 2px 10px; border-radius: 10px;
    font-size: 0.72rem; font-weight: 700;
  }
  .s-new       { background: rgba(201,168,76,0.15); color: var(--gold); }
  .s-confirmed { background: rgba(59,130,246,0.15); color: #60a5fa; }
  .s-delivered { background: rgba(37,211,102,0.15); color: var(--green); }
  .s-cancelled { background: rgba(255,107,107,0.15); color: var(--red); }

  .empty-orders { text-align: center; color: var(--cream-2); font-size: 0.88rem; padding: 24px 0; }

  .logout-btn {
    width: 100%;
    background: transparent;
    border: 1px solid rgba(255,107,107,0.3);
    color: var(--red);
    border-radius: 10px;
    padding: 11px;
    font-family: 'Cairo', sans-serif;
    font-size: 0.88rem;
    cursor: pointer;
    margin-top: 16px;
    transition: background 0.2s;
  }
  .logout-btn:hover { background: rgba(255,107,107,0.08); }

  .loading-orders { text-align: center; color: var(--cream-2); padding: 20px; font-size: 0.85rem; }
</style>
</head>
<body>

<div class="auth-card">
  <a href="index.html" class="logo">
    <img src="https://raw.githubusercontent.com/bokurna/bukorna/main/bukorna.png" 
         alt="بخورنا" 
         class="logo-img"
         onerror="this.parentElement.innerHTML='بخورنا';">
  </a>
  <div class="logo-sub">حسابك في بخورنا</div>
  <!-- Auth Forms -->
  <div class="auth-form" id="auth-form">
    <div class="tabs">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">تسجيل الدخول</button>
      <button class="tab-btn" id="tab-register" onclick="switchTab('register')">حساب جديد</button>
    </div>

    <!-- Login -->
    <div id="form-login">
      <div class="form-group">
        <label class="form-label">البريد الإلكتروني</label>
        <input class="form-input" id="login-email" type="email" placeholder="example@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">كلمة المرور</label>
        <input class="form-input" id="login-pass" type="password" placeholder="••••••••"
          onkeydown="if(event.key==='Enter') doLogin()">
      </div>
      <button class="submit-btn" id="login-btn" onclick="doLogin()">دخول</button>
      <div class="alert alert-error" id="login-error"></div>
    </div>

    <!-- Register -->
    <div id="form-register" style="display:none;">
      <div class="form-group">
        <label class="form-label">البريد الإلكتروني</label>
        <input class="form-input" id="reg-email" type="email" placeholder="example@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">كلمة المرور</label>
        <input class="form-input" id="reg-pass" type="password" placeholder="8 أحرف على الأقل">
      </div>
      <div class="form-group">
        <label class="form-label">رقم الجوال (اختياري)</label>
        <input class="form-input" id="reg-phone" type="tel" placeholder="05xxxxxxxx" maxlength="10" inputmode="numeric">
      </div>
      <button class="submit-btn" id="reg-btn" onclick="doRegister()">إنشاء الحساب</button>
      <div class="alert alert-success" id="reg-success"></div>
      <div class="alert alert-error"   id="reg-error"></div>
    </div>

    <div class="divider">أو</div>
    <div class="back-link">
      <a href="products.html">تصفح المنتجات بدون تسجيل ←</a>
    </div>
  </div>

  <!-- Profile (shown when logged in) -->
    <div class="profile-view" id="profile-view">
    <!-- شعار صغير بعد تسجيل الدخول -->
    <a href="index.html" class="logo logo-sm">
      <img src="https://raw.githubusercontent.com/bokurna/bukorna/main/bukorna.png" 
           alt="بخورنا" 
           class="logo-img"
           onerror="this.parentElement.innerHTML='بخورنا';">
    </a>

    <div class="profile-email">
      <div class="p-label">مرحباً بك</div>
      <div class="p-value" id="p-email"></div>
    </div>

    <div class="orders-title">📦 طلباتك</div>
    <div id="orders-list"><div class="loading-orders">جارٍ التحميل...</div></div>

    <button class="logout-btn" onclick="doLogout()">تسجيل الخروج</button>

    <div class="back-link" style="margin-top:16px;">
      <a href="products.html">← تصفح المنتجات</a>
    </div>
  </div>
</div>

<script>
var SB_URL  = 'https://ulaeuhltcsbvceaklobu.supabase.co';
var SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsYWV1aGx0Y3NidmNlYWtsb2J1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MjU1NjEsImV4cCI6MjA5NDEwMTU2MX0.ixR5qANmq5GPE9E6tQZfekyIT5t9zZ3Yuy9euOKeyEY';
var _sb = window.supabase.createClient(SB_URL, SB_ANON);

var STATUS_LABEL = { new:'جديد', confirmed:'تم التأكيد', delivered:'تم التسليم', cancelled:'ملغي' };
var STATUS_CLS   = { new:'s-new', confirmed:'s-confirmed', delivered:'s-delivered', cancelled:'s-cancelled' };

// Check session on load
_sb.auth.getSession().then(function(res) {
  if (res.data && res.data.session) showProfile(res.data.session.user);
});

// Listen for auth changes
_sb.auth.onAuthStateChange(function(event, session) {
  if (session) showProfile(session.user);
  else showAuthForm();
});

function switchTab(tab) {
  document.getElementById('form-login').style.display    = tab === 'login'    ? '' : 'none';
  document.getElementById('form-register').style.display = tab === 'register' ? '' : 'none';
  document.getElementById('tab-login').className    = 'tab-btn' + (tab === 'login'    ? ' active' : '');
  document.getElementById('tab-register').className = 'tab-btn' + (tab === 'register' ? ' active' : '');
}

async function doLogin() {
  var email = document.getElementById('login-email').value.trim();
  var pass  = document.getElementById('login-pass').value;
  var errEl = document.getElementById('login-error');
  errEl.className = 'alert alert-error';
  if (!email || !pass) { errEl.textContent = 'أدخل الإيميل وكلمة المرور'; errEl.classList.add('show'); return; }

  var btn = document.getElementById('login-btn');
  btn.textContent = '...'; btn.disabled = true;

  var { error } = await _sb.auth.signInWithPassword({ email, password: pass });
  btn.textContent = 'دخول'; btn.disabled = false;

  if (error) {
    var msg = error.message.includes('Invalid') ? 'الإيميل أو كلمة المرور غير صحيحة' : error.message;
    errEl.textContent = msg; errEl.classList.add('show');
  }
}

async function doRegister() {
  var email = document.getElementById('reg-email').value.trim();
  var pass  = document.getElementById('reg-pass').value;
  var phone = document.getElementById('reg-phone').value.trim();
  var errEl = document.getElementById('reg-error');
  var sucEl = document.getElementById('reg-success');
  errEl.className = 'alert alert-error';
  sucEl.className = 'alert alert-success';

  if (!email) { errEl.textContent = 'أدخل البريد الإلكتروني'; errEl.classList.add('show'); return; }
  if (pass.length < 8) { errEl.textContent = 'كلمة المرور يجب أن تكون 8 أحرف على الأقل'; errEl.classList.add('show'); return; }

  var btn = document.getElementById('reg-btn');
  btn.textContent = '...'; btn.disabled = true;

  var { error } = await _sb.auth.signUp({
    email, password: pass,
    options: { data: { phone: phone || null } }
  });

  btn.textContent = 'إنشاء الحساب'; btn.disabled = false;

  if (error) {
    var msg = error.message.includes('already') ? 'هذا الإيميل مسجّل مسبقاً' : error.message;
    errEl.textContent = msg; errEl.classList.add('show');
  } else {
    sucEl.textContent = '✅ تم إنشاء حسابك! تحقق من بريدك الإلكتروني للتأكيد.';
    sucEl.classList.add('show');
    errEl.className = 'alert alert-error';
  }
}

async function doLogout() {
  await _sb.auth.signOut();
  showAuthForm();
}

function showAuthForm() {
  document.getElementById('auth-form').classList.remove('hidden');
  document.getElementById('profile-view').classList.remove('visible');
}

function showProfile(user) {
  document.getElementById('auth-form').classList.add('hidden');
  document.getElementById('profile-view').classList.add('visible');
  document.getElementById('p-email').textContent = user.email;
  loadOrders(user.email);
}

async function loadOrders(email) {
  var list = document.getElementById('orders-list');
  // Orders are linked by phone - use phone from user metadata if available
  // For now, load recent orders (user can verify by order number)
  var phone = '';
  var { data: { user } } = await _sb.auth.getUser();
  if (user && user.user_metadata && user.user_metadata.phone) {
    phone = user.user_metadata.phone;
  }

  var query = _sb.from('orders').select('order_number,total,status,created_at,neighborhood').order('created_at', { ascending: false }).limit(10);
  if (phone) query = query.eq('phone', phone);

  var { data: orders, error } = await query;

  if (error || !orders || orders.length === 0) {
    list.innerHTML = '<div class="empty-orders">لا توجد طلبات مرتبطة بحسابك.<br><small>تأكد من إدخال رقم جوالك عند الطلب</small></div>';
    return;
  }

  list.innerHTML = orders.map(function(o) {
    var d = new Date(o.created_at);
    var dateStr = d.toLocaleDateString('ar-SA', { month:'short', day:'numeric' });
    var st = o.status || 'new';
    return '<a href="track.html?order=' + o.order_number + '" class="order-item">'
      + '<div><div class="order-item-num">#' + o.order_number + '</div>'
      + '<div class="order-item-info">' + dateStr + (o.neighborhood ? ' · ' + o.neighborhood : '') + '</div></div>'
      + '<div style="text-align:left">'
      + '<div class="order-item-total">' + o.total + ' ر.س</div>'
      + '<div style="margin-top:4px"><span class="status-pill ' + (STATUS_CLS[st]||'s-new') + '">' + (STATUS_LABEL[st]||st) + '</span></div>'
      + '</div></a>';
  }).join('');
}
</script>
</body>
</html>
