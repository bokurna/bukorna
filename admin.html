<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بخورنا | لوحة التحكم المطورة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ... (نفس الستستايل الخاص بك مع تحسينات بسيطة) ... */
:root {
  --gold: #c9a84c; --gold-light: #e8c97a; --gold-dark: #8a6a1f;
  --dark: #0d0a07; --dark-2: #1a1410; --dark-3: #261e14;
  --cream: #f5ead6; --cream-2: #ede0c4; --green: #25D366;
  --red: #ff6b6b; --blue: #4da6ff;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Cairo', Arial, sans-serif; background: var(--dark); color: var(--cream); min-height: 100vh; }
#login-screen, #setup-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.login-box, .setup-box { background: var(--dark-2); border: 1px solid rgba(201,168,76,0.2); border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 450px; text-align: center; }
.login-logo { font-size: 2rem; font-weight: 900; color: var(--gold); margin-bottom: 6px; }
.login-sub { font-size: 0.85rem; color: rgba(245,234,214,0.45); margin-bottom: 32px; }
.login-field, .setup-input { width: 100%; background: rgba(245,234,214,0.06); border: 1px solid rgba(201,168,76,0.2); border-radius: 8px; padding: 12px 16px; color: var(--cream); margin-bottom: 12px; text-align: right; outline: none; }
.login-btn, .setup-btn, .btn { background: var(--gold); color: var(--dark); border: none; padding: 12px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; font-family: 'Cairo'; }
.login-btn:hover, .btn:hover { background: var(--gold-light); }
.app-nav { background: var(--dark-2); border-bottom: 1px solid rgba(201,168,76,0.15); padding: 0 24px; height: 60px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
.tabs { display: flex; border-bottom: 1px solid rgba(201,168,76,0.1); padding: 0 24px; background: var(--dark-2); overflow-x: auto; }
.tab-btn { background: none; border: none; padding: 14px 20px; color: rgba(245,234,214,0.45); cursor: pointer; border-bottom: 2px solid transparent; font-family: 'Cairo'; font-weight: 600; }
.tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
.content { padding: 24px; max-width: 1100px; margin: 0 auto; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 28px; }
.stat-card { background: var(--dark-2); border: 1px solid rgba(201,168,76,0.12); border-radius: 12px; padding: 20px; }
.table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid rgba(201,168,76,0.12); }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 12px 16px; text-align: right; border-top: 1px solid rgba(245,234,214,0.04); }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 500; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal { background: var(--dark-2); border: 1px solid rgba(201,168,76,0.2); border-radius: 16px; padding: 28px; width: 100%; max-width: 480px; }
#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 8px; opacity: 0; transition: 0.3s; z-index: 1000; }
#toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="setup-screen">
  <div class="setup-box">
    <div class="login-logo">بخورنا ⚙️</div>
    <p class="login-sub">إعداد الاتصال بـ Supabase</p>
    <input class="setup-input" id="setup-url" placeholder="Project URL" type="url">
    <input class="setup-input" id="setup-anon" placeholder="Anon Key" type="text">
    <input class="setup-input" id="setup-service" placeholder="Service Role Key (اختياري)" type="password">
    <button class="setup-btn" onclick="saveSetup()">💾 حفظ الإعدادات</button>
    <div id="setup-err" style="color:var(--red); margin-top:10px;"></div>
  </div>
</div>

<div id="login-screen" style="display:none">
  <div class="login-box">
    <div class="login-logo">بخورنا</div>
    <input class="login-field" id="login-email" type="email" placeholder="البريد الإلكتروني">
    <input class="login-field" id="login-pass"  type="password" placeholder="كلمة المرور">
    <button class="login-btn" onclick="doLogin()">دخول</button>
    <div id="login-err" style="color:var(--red); margin-top:10px;"></div>
    <button onclick="resetSetup()" style="background:none; border:none; color:gray; cursor:pointer; margin-top:15px;">تعديل الربط</button>
  </div>
</div>

<div id="app" style="display:none">
  <nav class="app-nav">
    <div class="app-nav-logo">بخورنا <span style="font-size:0.7rem; font-weight:normal;">لوحة الإدارة</span></div>
    <button class="btn" style="background:rgba(255,107,107,0.1); color:var(--red);" onclick="doLogout()">خروج</button>
  </nav>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('orders',this)">📋 الطلبات</button>
    <button class="tab-btn" onclick="switchTab('products',this)">📦 المنتجات</button>
    <button class="tab-btn" onclick="switchTab('stats',this)">📊 الإحصائيات</button>
  </div>

  <div id="tab-orders" class="content">
    <div class="stats-grid" id="orders-stats">
        <div class="stat-card"><div>إجمالي الطلبات</div><div id="s-total" style="font-size:1.5rem; font-weight:900;">0</div></div>
        <div class="stat-card"><div>المبيعات</div><div id="s-revenue" style="font-size:1.5rem; font-weight:900; color:var(--gold);">0</div></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>الطلب</th><th>الحي</th><th>الإجمالي</th><th>الحالة</th><th>إجراءات</th></tr></thead>
        <tbody id="orders-tbody"></tbody>
      </table>
    </div>
  </div>

  <div id="tab-products" class="content" style="display:none">
    <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
        <h3>إدارة المنتجات</h3>
        <button class="btn" onclick="openProductModal()">+ منتج جديد</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>المنتج</th><th>السعر</th><th>المخزون</th><th>إجراءات</th></tr></thead>
        <tbody id="products-tbody"></tbody>
      </table>
    </div>
  </div>

  <div id="tab-stats" class="content" style="display:none">
      <div class="stat-card">تحت التطوير...</div>
  </div>
</div>

<div class="modal-overlay" id="product-modal">
  <div class="modal">
    <h3 id="product-modal-title">منتج جديد</h3>
    <input type="hidden" id="product-id">
    <input class="login-field" id="p-name" placeholder="اسم المنتج">
    <input class="login-field" id="p-price" type="number" placeholder="السعر">
    <input class="login-field" id="p-img" placeholder="رابط الصورة">
    <div class="modal-actions" style="display:flex; gap:10px; margin-top:15px;">
      <button class="btn" style="flex:1" onclick="saveProduct()">حفظ</button>
      <button class="btn" style="flex:1; background:gray" onclick="closeModal('product-modal')">إلغاء</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let supabase = null;
let allProducts = []; // مخزن مؤقت للمنتجات لتجنب مشاكل JSON في الـ HTML

function getConfig() {
    return {
        url: localStorage.getItem('sb_url'),
        anon: localStorage.getItem('sb_anon'),
        service: localStorage.getItem('sb_service')
    };
}

function initSupabase() {
    const cfg = getConfig();
    if (!cfg.url || !cfg.anon) return false;
    supabase = window.supabase.createClient(cfg.url, cfg.service || cfg.anon);
    return true;
}

async function saveSetup() {
    const url = document.getElementById('setup-url').value.trim();
    const anon = document.getElementById('setup-anon').value.trim();
    const service = document.getElementById('setup-service').value.trim();

    if(!url || !anon) return alert("يرجى ملء البيانات الأساسية");

    localStorage.setItem('sb_url', url);
    localStorage.setItem('sb_anon', anon);
    localStorage.setItem('sb_service', service);

    location.reload();
}

function resetSetup() {
    localStorage.clear();
    location.reload();
}

async function doLogin() {
    const email = document.getElementById('login-email').value;
    const pass = document.getElementById('login-pass').value;
    const { error } = await supabase.auth.signInWithPassword({ email, password: pass });

    if (error) {
        document.getElementById('login-err').textContent = "خطأ: " + error.message;
    } else {
        showApp();
    }
}

function showApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadOrders();
    loadProducts();
}

function switchTab(name, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-orders').style.display = name === 'orders' ? 'block' : 'none';
    document.getElementById('tab-products').style.display = name === 'products' ? 'block' : 'none';
    document.getElementById('tab-stats').style.display = name === 'stats' ? 'block' : 'none';
}

async function loadOrders() {
    const { data, error } = await supabase.from('orders').select('*').order('created_at', { ascending: false });
    if (error) return console.error(error);

    const tbody = document.getElementById('orders-tbody');
    let revenue = 0;
    
    tbody.innerHTML = data.map(o => {
        revenue += parseFloat(o.total || 0);
        return `
            <tr>
                <td>#${o.order_number}</td>
                <td>${o.neighborhood || '-'}</td>
                <td style="color:var(--gold)">${parseFloat(o.total).toFixed(2)} ر.س</td>
                <td>${o.status}</td>
                <td><button class="btn" style="padding:4px 8px" onclick="toast('قيد التطوير')">عرض</button></td>
            </tr>
        `;
    }).join('');

    document.getElementById('s-total').textContent = data.length;
    document.getElementById('s-revenue').textContent = revenue.toFixed(0) + " ر.س";
}

async function loadProducts() {
    const { data, error } = await supabase.from('products').select('*').order('sort_order');
    if (error) return;

    allProducts = data; // تحديث المخزن المؤقت
    const tbody = document.getElementById('products-tbody');
    tbody.innerHTML = data.map(p => `
        <tr>
            <td>${p.name}</td>
            <td>${parseFloat(p.price).toFixed(2)}</td>
            <td>${p.in_stock ? '✅' : '❌'}</td>
            <td>
                <button class="btn" onclick="editProduct('${p.id}')">تعديل</button>
            </td>
        </tr>
    `).join('');
}

function openProductModal() {
    document.getElementById('product-id').value = "";
    document.getElementById('p-name').value = "";
    document.getElementById('p-price').value = "";
    document.getElementById('p-img').value = "";
    document.getElementById('product-modal-title').textContent = "إضافة منتج";
    openModal('product-modal');
}

function editProduct(id) {
    const p = allProducts.find(item => item.id === id);
    if (!p) return;

    document.getElementById('product-id').value = p.id;
    document.getElementById('p-name').value = p.name;
    document.getElementById('p-price').value = p.price;
    document.getElementById('p-img').value = p.image_url || "";
    document.getElementById('product-modal-title').textContent = "تعديل: " + p.name;
    openModal('product-modal');
}

async function saveProduct() {
    const id = document.getElementById('product-id').value;
    const name = document.getElementById('p-name').value;
    const price = document.getElementById('p-price').value;
    const img = document.getElementById('p-img').value;

    const payload = { name, price: parseFloat(price), image_url: img };

    let res;
    if (id) {
        res = await supabase.from('products').update(payload).eq('id', id);
    } else {
        res = await supabase.from('products').insert([payload]);
    }

    if (res.error) {
        toast("خطأ أثناء الحفظ", "error");
    } else {
        toast("تم الحفظ بنجاح");
        closeModal('product-modal');
        loadProducts();
    }
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function toast(msg, type="success") {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = type === "error" ? "var(--red)" : "var(--gold-dark)";
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

async function doLogout() {
    await supabase.auth.signOut();
    location.reload();
}

// البدء
(async () => {
    if (initSupabase()) {
        const { data } = await supabase.auth.getSession();
        if (data.session) {
            showApp();
        } else {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
        }
    }
})();
</script>
</body>
</html>
